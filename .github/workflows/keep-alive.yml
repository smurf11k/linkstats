name: Keep Supabase alive

on:
  schedule:
    - cron: "0 00 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Request site
        run: >-
          curl --fail --silent --show-error --retry 3 --max-time 30
          https://smurf11k.github.io/linkstats/

      - name: Ping Supabase health endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: >-
          curl --fail --silent --show-error --retry 3 --max-time 30
          "${SUPABASE_URL}/auth/v1/health"
